apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathpilot-backend
  labels:
    app: pathpilot-backend
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: pathpilot
    meta.helm.sh/release-namespace: default
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: pathpilot-backend
  template:
    metadata:
      labels:
        app: pathpilot-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.existingSecret }}
                  key: {{ .Values.backend.database.passwordKey }}
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.backend.database.username }}:$(POSTGRES_PASSWORD)@{{ .Values.backend.database.host }}:{{ .Values.backend.database.port }}/{{ .Values.backend.database.name }}"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pathpilot-backend
  labels:
    app: pathpilot-backend
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: pathpilot
    meta.helm.sh/release-namespace: default
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: pathpilot-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 5000
      {{- if eq .Values.backend.service.type "NodePort" }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
