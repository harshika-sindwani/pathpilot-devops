# PathPilot Helm configuration

# Frontend configuration
frontend:
  replicaCount: 1
  image:
    repository: harshika274/pathpilot-frontend
    tag: k8s
    pullPolicy: Always
  service:
    type: NodePort
    port: 80
    nodePort: 30083
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: harshika274/pathpilot-backend
    tag: latest
    pullPolicy: Always
  service:
    type: NodePort
    port: 5000
    nodePort: 30082
  database:
    host: pathpilot-postgres
    port: 5432
    name: placement_tracker
    username: placement_user
    existingSecret: pathpilot-db-secret
    passwordKey: POSTGRES_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# PostgreSQL configuration
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  database: placement_tracker
  username: placement_user
  existingSecret: pathpilot-db-secret
  passwordKey: POSTGRES_PASSWORD
  service:
    port: 5432
  persistence:
    existingClaim: pathpilot-postgres-pvc
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi 
      # Automated PostgreSQL backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"
  timeZone: "Asia/Kolkata"
  retentionDays: 7
  persistence:
    size: 1Gi
