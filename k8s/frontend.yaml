apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathpilot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pathpilot-frontend
  template:
    metadata:
      labels:
        app: pathpilot-frontend
    spec:
      containers:
        - name: frontend
          image: placement-tracker-frontend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pathpilot-frontend
spec:
  type: NodePort
  selector:
    app: pathpilot-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
