apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pathpilot-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pathpilot-postgres
spec:
  serviceName: pathpilot-postgres
  replicas: 1
  selector:
    matchLabels:
      app: pathpilot-postgres
  template:
    metadata:
      labels:
        app: pathpilot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: placement_tracker
            - name: POSTGRES_USER
              value: placement_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pathpilot-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: pathpilot-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pathpilot-postgres
spec:
  type: ClusterIP
  selector:
    app: pathpilot-postgres
  ports:
    - port: 5432
      targetPort: 5432
