service:
  type: NodePort
  nodePort: 30090

persistence:
  enabled: false

adminUser: admin
adminPassword: "YOUR_STRONG_PASSWORD"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /api/health
    port: grafana
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /api/health
    port: grafana
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /api/health
    port: grafana
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

testFramework:
  enabled: false
